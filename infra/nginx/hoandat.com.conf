# .65: /etc/nginx/conf.d/hoandat.com.conf. Cloudflare (proxied, SSL "full")
# -> here. Static files only: the build of home-next synced by infra/deploy.sh.
# www redirects to the apex so the page has one address.

server {
    listen 80;
    listen [::]:80;
    server_name hoandat.com www.hoandat.com;
    return 301 https://hoandat.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    return 301 https://hoandat.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hoandat.com;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    access_log /var/log/nginx/hoandat.com.access.log;
    error_log  /var/log/nginx/hoandat.com.error.log;

    root /var/www/hoandat-home/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # No inline script or style in the build; fonts are self-hosted. The
    # Cloudflare Web Analytics beacon (injected at the zone) is allowed: it counts
    # landing visits without cookies.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Vite fingerprints everything under /assets/: cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Self-hosted fonts keep fixed names; a month is plenty.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
