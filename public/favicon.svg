<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Hoandat Apps: the shared mark of the *-next ecosystem (social avatars, directory listings).
       Four app tiles in a 2x2 grid, one in the accent colour: one account, several apps.
       Colours come from the products' shared palette: violet gradient of Chat's icon
       (#8874d8 -> #5a47aa, primary #6e56cf) and Scribe's plum accent (#e796f3).
       Full-bleed square because Facebook and YouTube crop avatars to a circle; the tiles stay
       inside the central circle (radius ~330 of 512) so nothing is cut off. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8874d8"/>
      <stop offset="1" stop-color="#5a47aa"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g>
    <rect x="292" y="292" width="200" height="200" rx="56" fill="#fff"/>
    <rect x="532" y="292" width="200" height="200" rx="100" fill="#e796f3"/>
    <rect x="292" y="532" width="200" height="200" rx="56" fill="#fff"/>
    <rect x="532" y="532" width="200" height="200" rx="56" fill="#fff"/>
  </g>
</svg>
